    batteri passano. In più a volte i produttori aggiungono formaldeide o altri conservanti
    per evitare pieghe e muffa durante il viaggio, e i colori accesi prima del primo
    lavaggio possono passare sulla pelle e irritarla. La dermatologa consiglia un
    lavaggio delicato con detersivo senza profumo.


