  - reel-2026-11-22-curiosita-porpora-nerone.mp4
  caption: 'Per colorare di viola solo il bordo di un vestito servivano 12.000 lumache
    🐌💜


    📌 La storia: la porpora si ricavava dalle lumache di mare (murici). Da 12.000
    lumache uscivano appena 1,4 grammi di colore, abbastanza per l''orlo di un vestito,
    e per questo costava una fortuna. Secondo lo storico Svetonio, l''imperatore Nerone
    la vietò, mandò di nascosto un uomo a venderne un po'' al mercato e poi fece chiudere
    i negozi di tutti i venditori, perché avevano violato il suo divieto.


    Mandalo a chi si veste di viola 👇

    Segui @cintre_official: ogni giorno una curiosità di moda.


