    l''amico Herbert Funck inizia a venderli in Germania: nel primo decennio l''80%
    delle vendite va a donne sopra i 40 anni. Poi l''inglese Griggs compra i diritti,
    e il 1° aprile 1960 nasce il modello 1460 (il nome è la data!). Prima lo portano
    postini, poliziotti e operai, solo dopo skinhead e punk.


    Segui @cintre_official e metti like ❤️ ogni giorno una curiosità di moda.


