  - reel-2026-11-23-curiosita-rosa-maschi.mp4
  caption: 'I vestiti rosa erano da maschi, quelli blu da femmine 💗💙


    📌 La storia: nel giugno 1918 una pubblicazione per i negozi di abbigliamento per
    bambini scriveva che "la regola generalmente accettata è rosa per i maschi e blu
    per le femmine": il rosa, colore più deciso e forte, era adatto al maschio; il
    blu, più delicato e grazioso, alla femmina. Nel 1927 la rivista Time pubblicò
    i consigli dei grandi negozi americani, e molti dicevano ancora rosa ai maschi.
    Prima, i bambini piccoli si vestivano quasi tutti di bianco, che si poteva lavare
    spesso. La regola di oggi l''hanno fissata produttori e negozi solo negli anni
    ''40.


    Segui @cintre_official e metti like ❤️ ogni giorno una curiosità di moda.


    Fonti: Smithsonian Magazine (J. Maglaty, 2011; J. B. Paoletti, ''Pink and Blue''),
    Wikipedia ''Pink''.

