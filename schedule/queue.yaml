  caption: 'Il fondatore di Prada aveva v*etato alle donne di lavorare nella sua azienda
    👜


    📌 La storia: Mario Prada, che aprì il suo negozio di pelletteria a Milano nel
    1913, non voleva donne in azienda. Ma suo figlio non aveva nessun interesse per
    gli affari, così a guidare Prada fu la figlia Luisa, per quasi vent''anni. Dal
    1978 toccò alla nipote, Miuccia, che rese Prada famosa con zaini e borse in nylon
    nero: lo stesso tessuto resistente che il nonno usava per coprire i bauli.


    Tu lo sapevi? Scrivilo nei commenti 👇

    Salvalo e segui @cintre_official: ogni giorno una curiosità di moda.


