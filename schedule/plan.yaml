# Palinsesto di @teamupesportsofficial — modificabile a mano.
# "Genera bozze" (UI o `python -m auto_ig.planner`) riempie i giorni liberi con BOZZE:
# niente viene pubblicato finché non premi "Approva" nella pagina Coda.

orario: "18:00"            # ora locale di pubblicazione
giorni_avanti: 7           # quanti giorni futuri riempire
giorni: [lun, mar, mer, gio, ven, sab, dom]
alternanza: [image, reel]  # tipo di post a rotazione, un giorno ciascuno

hashtag: "#esports #gaming #gamingitalia #torneo #teamupesports"

immagini:
  fonte: wikimedia         # wikimedia | openverse | pixabay | auto
  crediti: true            # aggiunge "📷 autore via fonte (licenza)" alla caption
  # Ricerche in inglese (più risultati). Usate a rotazione.
  ricerche:
    - esports
    - esports arena
    - LAN party
    - video game tournament
    - gaming setup
    - game controller
    - arcade cabinet
    - Intel Extreme Masters
    - DreamHack
    - mechanical keyboard
    - gaming headset
    - retro video game console
  caption:
    - "Il setup conta. Il team di più. 🎮"
    - "Da soli si gioca. In squadra si vince. 🏆"
    - "Ogni campione ha iniziato da una partita in LAN."
    - "Qual è il gioco che ti ha fatto innamorare degli esports? 👇"
    - "Il tuo prossimo torneo inizia da qui."
    - "GG a chi gioca per vincere, e a chi gioca per divertirsi. 💜"
    - "La storia dei videogiochi, una partita alla volta."
    - "Salvalo per la prossima serata con il tuo team. 📌"

reel:
  durata: 8                # secondi
  scene: [testo, particelle, oggetto]
  # Coppie [sfondo, accento] a rotazione
  colori:
    - ["#690aba", "#32bbf0"]
    - ["#0b0a14", "#a855f7"]
    - ["#0b0a14", "#32bbf0"]
    - ["#111827", "#facc15"]
  testi:
    - "Il tuo team ti sta cercando."
    - "Da solo si gioca. Insieme si vince."
    - "Ti manca il quinto? Trovalo su TeamUp."
    - "Ogni torneo inizia da un team."
    - "Smetti di giocare in solo queue."
    - "Il prossimo campione potresti essere tu."
  caption:
    - "Un pensiero per chi gioca oggi. 🎮"
    - "Ti ritrovi? Scrivilo nei commenti 👇"
    - "Mandalo al tuo duo. 💬"
    - "Salvalo per il prossimo torneo. 📌"
