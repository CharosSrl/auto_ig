# Richiesta di contenuto — compilata da Claude su indicazione di Antonio.
titolo: "Esempio voice-over"
stato: generato            # da_fare | generato | in_coda | scartato
richiesta: "Esempio dimostrativo creato da Claude per mostrare voce + testo evidenziato"    # cosa ha chiesto Antonio, parole sue

# Video sotto la voce: scena three.js (testo | oggetto | particelle | ...) e colori
scena: testo
colori:
  sfondo: "#1d3557"
  accento: "#ffd166"      # anche colore della parola evidenziata
testo_scena: ""           # testo fisso della scena (vuoto = nessuno; per 'testo' usa il titolo)

# Voce (Piper, locale) e copione: una riga = una frase detta e mostrata a schermo
voce:
  modello: it_IT-paola-medium
  velocita: 1.0           # 0.8 più lenta, 1.2 più veloce
copione:
  - "Il tuo armadio parla di te."
  - "Scegli pochi capi, ma scegli bene."
  - "Ogni giorno, il tuo stile."
  - "Questo è Cintre."

# Pubblicazione (facoltativa): usata da "coda", entra sempre come BOZZA
pubblicazione:
  quando: ""              # es. 2026-11-20T18:00+01:00
  caption: "Il tuo stile, ogni giorno. ✨\n\n#moda #stile #cintre"
