# FORMATI DEI CONTENUTI — catalogo letto dal codice (auto_ig/formati.py) e guida per Claude.
#
# Livelli:   formato (storia | quiz | curiosita)  →  resa (3d | 2d)  →  scena + preset
#   - formato: COSA raccontiamo e con che scaletta (ruoli delle frasi, durata, tono, CTA).
#   - resa:    COME lo mostriamo. 3d = modella Cintre e preset three.js; 2d = grafica piatta a schede.
#   - ricetta: regole da seguire per generare scene coerenti (è il "prompt" fisso di Claude).
#
# In richiesta.yaml:   formato: curiosita   resa: 2d   cta: ""  (vuoto = CTA predefinita del formato)   mascotte: false
# MASCOTTE (modella Cintre 3D/2D): SOLO se la chiede Antonio (al massimo proporla nelle domande). Vedi hook_e_cta.
# NARRATORE (la gruccia di Cintre, Antonio 2026-11-21): in TUTTI i reel 2D (cartoon2d, schede2d), in basso a destra,
#   con labiale ed espressioni calcolati dall'audio (auto_ig/labiale.py). narratore: false | {lato: sinistra, s: 0.9}.
# La CTA viene AGGIUNTA SEMPRE come ultima frase dal sistema: non va scritta nel copione.
# Con resa 2d ogni frase del copione ha una `scheda` (cosa si vede mentre la voce parla):
#   - {testo: "...", scheda: {tipo: fatto, numero: 1, titolo: "Il taschino dei jeans", icona: taschino}}

regole_comuni:
  - "Brand Cintre: bordeaux #6d1a36, rosa cipria #e8c4c0, scuro #1a0710, crema #fffaf9; logo = gruccia (brand.js)."
  - "Una frase del copione = un atto della scena = una scheda (sincronizzati con la voce dal parametro atti)."
  - "Frasi brevi da parlato (max ~14 parole), seconda persona o prima persona, niente elenchi letti."
  - "Contenuto importante nel 58% alto dell'immagine: sotto ci sono sottotitoli e caption di Instagram."
  - "PRIMA DI TUTTO leggi marca/lezioni.md: sono le regole ricavate dagli Insights dei nostri reel e hanno la precedenza. In breve: vince il tempo di visione, domanda + opzioni A/B/C dal primo fotogramma, quiz invece di lezione, argomenti Gen Z adatti ai minori, sotto i 25 s."
  - "HOOK E CTA SONO LA COSA PIÙ IMPORTANTE (regola di Antonio): seguire hook_e_cta qui sotto, senza eccezioni."
  - "Mascotte (modella Cintre) solo se Antonio la chiede: mascotte: false di default; se sembra adatta, chiederlo nelle domande."
  - "Solo fatti verificabili: niente date o attribuzioni inventate; se incerto si riformula o si toglie."
  - "Ultima frase SEMPRE la call to action (la aggiunge il sistema): UNA sola, sempre 'Segui la pagina e metti like!' (Antonio, 2026-11-22; vedi hook_e_cta)."
  - "Caption (skill caption-writer): prima riga = gancio entro 125 caratteri, 1-2 righe di valore, la STESSA CTA del video, 3-5 hashtag (#cintre sempre)."

# Icone vettoriali della resa 2d (preset/grafica2d.js → ICONE). Per un'icona nuova: disegnala lì e aggiungila qui.
icone_2d: [taschino, orologio, tacco, staffa, tubino, auto, lampadina, domanda, commento, cuore, stella, gruccia, telefono, armadio, outfit,
           trench, elmetto, cardigan, medaglia, bikini, atomo, cravatta, sciabole, sneaker, pugnale, silenzio,
           jeans, sposa, corona, maglia, mutande, zeppa, sughero, borsa, bambu, aereo, polso, baule, lucchetto, lente, paglietta, pagliettaRotta, lumaca, crocs]

# Tipi di scheda della resa 2d (scena schede2d) e campi usati.
schede_2d:
  gancio:    "titolo grande (evidenzia = parola in colore accento), icona, timbro 'Lo sapevi?'/'Quiz!'; nel QUIZ con opzioni: [A, B, C] è già la schermata del quiz (domanda + opzioni dal fotogramma 0, solo cartoon2d)"
  fatto:     "numero (cerchio), titolo, icona grande: apre un punto (curiosità n, consiglio n)"
  dettaglio: "stessa card del fatto prima; testo breve (la 'risposta') e icona nuova a fianco"
  domanda:   "domanda del quiz (titolo) e opzioni A/B/C (opzioni: [..]); con conto: 3 è l'attesa (3-2-1 con tic, voce \"Tre. Due. Uno.\")"
  risposta:  "le stesse opzioni, quella giusta (giusta: indice da 0) si illumina con la spunta; testo = perché"
  scena:     "illustrazione piatta di una situazione (icona grande + titolo), per le storie in 2d"
  foto:      "foto VERA grande (foto: file in <richiesta>/foto/, scaricato con 'python -m auto_ig.richieste foto'; solo PD/CC0 da Wikimedia), entra in bianco e nero e si colora; titolo corto sopra, timbro facoltativo (es. anno), credito nella cornice (credito: '...'). È il PREMIO dopo la risposta"
  # FOTO DAL FOTOGRAMMA 0 (marca/lezioni.md n. 12): nei quiz/curiosità 2D la PRIMA scheda ha sempre `foto` (+ credito);
  # vale anche su fatto/dettaglio (la foto viva al posto dell'icona). Quiz: domanda/risposta ereditano la foto del
  # gancio; `foto_risposta` la cambia sulla risposta. Cornice: `cornice:` nella richiesta o nella scheda
  # (polaroid | oro | pellicola | nastro; default quiz oro, curiosità polaroid). Foto viva: onda, riflesso, glitch.
  commenta:  "fumetto con titolo (domanda al pubblico) e icone commento/cuore"
  rehook:    "a metà video: titolo enorme che trema ('Aspetta l'ultima...') + carta mistero della prossima curiosità (solo cartoon2d)"
  timeline:  "(solo cartoon2d) INFOGRAFICA a codice (preset infografica2d.js): titolo + tappe verticali che si disegnano (tappe: [{quando: '1871', testo: 'Tasche strappate', icona: jeans}], attiva: indice della tappa di questa frase). Più schede timeline CONSECUTIVE con le stesse tappe = una sola timeline che cresce, le tappe dopo restano nascoste. Testi delle tappe ≤ 4 parole. Usala per storie con date o passaggi in sequenza, soprattutto senza foto adatta"
  mappa:     "(solo cartoon2d) INFOGRAFICA a codice: sagoma del paese (regione: usa) con un percorso tratteggiato, puntini che si accendono uno alla volta mentre la voce parla e un'icona che viaggia (icona: auto). Puntini illustrativi, mai presentati come dati. Usala per viaggi, diffusione, 'in tutta l'America'"
  contatore: "(solo cartoon2d) GRAFICA VIVA: numero enorme che sale (da, a, unita: 'litri', durata: secondi) mentre una vasca si riempie; tic che rallentano e conferma all'arrivo. Per i numeri sorprendenti. forma: pila (+ icona: lumaca) = niente vasca, le icone cadono e si ammucchiano in una piramide mentre il numero sale (la vasca è già usata: preferire pila)"
  radar:     "(solo cartoon2d) GRAFICA VIVA: un punto nel mare visto dall'alto (atollo), cerchi radar che pulsano con un ping, mirino, etichetta del posto (etichetta: 'BIKINI · 1946'); esplode: secondi → lampo. Per luoghi lontani"
  scena2d:   "(solo cartoon2d) SCENA ANIMATA con personaggi (comparse, NON la mascotte): sfondo studio|campo|mare|casa|miniera, attori: [{azione: cammina|indica|sorpresa|disegna|legge|versa|lancia|raccoglie|saluta, x, verso: 1|-1, maglia, pantaloni, capelli, pelle: 0-3, cappello: basco|paglia|corona|casco|turbante, baffi, tacchi: '#colore', lanterna: true, quando, dice: 'BIKINI!'}], oggetti: [{cosa: tavolo|giornale|lavatrice|cotone|gocce|eiffel|jeansVecchi|icona, x, y, s, testo, icona}]"
  chat:      "(solo cartoon2d) GRAFICA VIVA: chat IDENTICA a WhatsApp (regola di Antonio, 2026-11-21: intestazione verde con avatar, 'online' → 'sta scrivendo…', sfondo beige coi disegnini, fumetti verdi/bianchi con codina, ora e spunte blu, barra 'Messaggio' col microfono verde; niente logo) tra due amici INVENTATI (mai profili veri): messaggi: [{da: a|b, testo: '...'}] (≤ 4, corti; a = io a destra, b = l'amico), nome: 'Giulia', ora: '21:14'. I miei si scrivono lettera per lettera nella barra, i suoi coi tre puntini; ogni fumetto arriva con un ding. Per domande che si fanno tra amici ('ma perché…?')"
  lente:     "(solo cartoon2d) GRAFICA VIVA: oggetto disegnato (icona) e lente d'ingrandimento che lo scorre e si ferma su un dettaglio (punto: [dx, dy] da -1 a 1), cerchiato di rosso con etichetta. Per 'guarda bene i tuoi…'"
  confronto: "(solo cartoon2d) GRAFICA VIVA: schermo diviso PRIMA | DOPO con tendina che scorre: prima: {icona, etichetta}, dopo: {icona, etichetta}. Per cambi d'uso, 'era per… ora è per…'"
  # GANCIO VIVO (Antonio, 2026-11-19: "serve qualcosa di dinamico fin dall'inizio"): il gancio può avere
  # `grafica: {tipo: contatore|radar|scena2d|chat|lente|confronto, ..., anticipo: 0.6}` al posto della foto: al fotogramma 0 è già in moto,
  # niente intestazione "Cintre · LO SAPEVI?", solo il titolo grande.
  cta:       "cartello finale secondo cta_azione del formato (segui_like: Segui + cuore, la CTA fissa; salva_condividi: segnalibro + Invia; segui: bottone Segui; commenta: fumetto; app: telefono); messa dal sistema"

# HOOK E CTA — la parte più importante di ogni contenuto (Antonio, 2026-11-14). Skill: .claude/skills/hook-writer,
# short-form-video-script, caption-writer, viral-hooks; profilo e voce del brand in marca/.
hook_e_cta:
  hook:
    - "Si estrae dal fatto più forte e VERO del video (mai inventato, mai una promessa che il video non mantiene)."
    - "Scrivi 5-10 candidati con meccanismi diversi (curiosità, contrasto, specificità/numero, posta in gioco, identità, domanda)."
    - "Punteggio 0-2 su: gap, specificità, verità, entra in 3 s, voce Cintre, 'devo vedere il resto'. Verità e pull = 0 → scartato. Tieni solo ≥ 9/12."
    - "≤ 12 parole, argomento nelle prime 5, detto in ≤ 3 s; a schermo dal fotogramma 0 (testo + immagine + voce insieme, funziona anche muto)."
    - "Mai aprire con saluti, 'Oggi parliamo di', 'Lo sapevi che', logo o intro lente. Non svelare il payoff: tieni aperto il loop."
    - "In richiesta.yaml annota i candidati scartati e il punteggio del vincente (commento), così Antonio vede la scelta."
  cta:
    - "Antonio, 2026-11-22: \"la call to action nuova sarà di seguire la pagina e mettere like\", in TUTTI i video. È sempre 'Segui la pagina e metti like!' (cta_azione: segui_like), ~2 s."
    - "Mai una seconda CTA nel video (niente 'grazie per aver guardato', niente commenta/mandalo in più)."
    - "La stessa CTA va nel video (voce + cartello animato) e nella caption."
  attenzione:
    - "Promessa aperta nei primi 3 s, ripagata per ultima; rehook al 40-60% del video; ogni frase deve agganciare, insegnare o preparare il payoff, sennò si taglia."
    - "Struttura a domanda aperta (regia-reel §12): gancio → attesa → rehook → attesa → risposta. Nessuna frase risponde prima della fine; dopo la risposta solo la CTA, ≤ 2 s."
    - "Prima di scrivere: 3 strutture possibili (storia unica, prima/dopo, conto alla rovescia, elenco che si ribalta), scegline una e annota il perché nella richiesta (regia-reel §14)."

# RITMO ALTO (resa 2d con scena cartoon2d). Sintesi della ricerca del 2026-11-14 (skill .claude/skills/viral-hooks e
# short-form-video; skip rate di Instagram = chi esce entro 3 s). I numeri dei blog sono indicativi, le regole no.
ritmo_alto:
  - "Gancio a schermo dal fotogramma 0 (niente dissolvenza dal nero); parola chiave detta entro 1-1,5 s."
  - "Gancio = una sola promessa aperta (open loop): numero preciso + contrasto ('3 capi nati in guerra. L'ultimo è esplosivo')."
  - "Svela l'ultima curiosità per ultima; a metà (~12-15 s) un rehook ('Ma aspetta l'ultima...') con scheda rehook."
  - "Un cambio visivo ogni 1,5-3 s, irregolare: le battute le calcola auto_ig/audio.py e valgono anche per gli effetti sonori."
  - "Dentro la frase, un oggetto per ogni parola chiave (0,5-1,5 s, regia-reel §13); ogni scritta leggibile almeno 1,8 s; transizioni disegnate, mai dissolvenze."
  - "Ritmo che cambia: almeno un'accelerazione e un respiro, un silenzio breve prima del payoff, il cui suono è il più forte del reel (regia-reel §14)."
  - "Sottotitoli a blocco (default: 2 righe ferme, parola detta evidenziata), voce velocita 1.0 + pausa 0.4-0.5, frasi intere e chiare (marca/lezioni.md n. 13); titoli schede di max 4-7 parole."
  - "Durata 20-25 s (dati reali: il reel da 24 s ha battuto quelli da 27-35 s); frasi brevi, niente pause morte; audio: {musica: true, sfx: true}."
  - "Hook: due varianti di categorie diverse (stop-scroll: negazione/numero/domanda + ritenzione: storia/emozione), scegli la più forte."

formati:
  storia:
    nome: Storia
    scopo: "Mini racconto: un problema di stile reale risolto grazie all'app (con la modella Cintre solo se Antonio la chiede)."
    durata: [15, 30]
    struttura:
      - {ruolo: gancio,     guida: "Situazione + problema in 1 frase (\"Stasera ho una cena di lavoro...\")."}
      - {ruolo: problema,   guida: "1-2 frasi che peggiorano il problema, con emozione (tono arrabbiata)."}
      - {ruolo: svolta,     guida: "Apre Cintre e chiede aiuto (frase con il nome dell'app)."}
      - {ruolo: soluzione,  guida: "L'app propone l'outfit giusto: si vede il cambio d'abito (tono felice)."}
      - {ruolo: risultato,  guida: "La scena finale dimostra il successo (complimenti, sicurezza)."}
    cta: "Segui la pagina e metti like!"     # Antonio, 2026-11-22: CTA fissa in tutti i video
    cta_azione: segui_like
    hashtag: "#cintre #outfit #moda #stile #ootd"
    rese:
      3d:
        scene: [armadio_infinito, cintre_storia, genitori_cintre]
        ricetta:
          - "Modella Cintre (creaModella) SOLO se Antonio la chiede (mascotte: true); in quel caso sempre lei, stessa faccia/capelli."
          - "Genitori (mamma e papà, preset genitori.js → creaGenitore): personaggi secondari con gesti (bracciaConserte, rimprovera, copriOcchi, maniAlViso, applaude, pollice). Scena pronta: genitori_cintre."
          - "Outfit: prima un outfit 'spento' (OUTFIT_CASA/OUTFIT_GRIGIO), dopo uno da OUTFITS o creato con capi del guardaroba."
          - "Umore segue il copione: neutra → arrabbiata/sorpresa sul problema → felice dalla svolta in poi."
          - "Set dai preset ambienti.js (cameraDaLetto, armadio, corridoioArmadio, studio, ristorante, passerella...), uno ogni 30-40 unità su x; cambio set con dissolvenza."
          - "La svolta mostra SEMPRE l'app (telefonoCintre / studio con telefono grande) con la richiesta scritta (ricerca)."
          - "Ultimo atto = cartelloFinale (logo) mentre la voce dice la CTA."
          - "Camera: figura intera o 3/4, testa nel terzo alto; mai inquadrature sotto il 58% dell'immagine."
          - "Nuovi oggetti o ambienti riutilizzabili vanno nei preset, la scena contiene solo la regia."
      2d:
        scene: [schede2d]
        ricetta:
          - "Una scheda 'scena' per atto: icona grande della situazione (armadio, telefono, cena...) + titolo di 2-4 parole."
          - "Il gancio usa 'gancio'; il momento dell'app usa l'icona telefono; la soluzione usa l'icona outfit (figurino)."

  quiz:
    nome: Quiz
    scopo: "Domanda di stile con 2-3 risposte: fa commentare e salvare."
    durata: [15, 35]
    struttura:
      - {ruolo: gancio,   guida: "Sfida concreta legata a qualcosa che chi guarda ha addosso o conosce, ≤ 12 parole (hook_e_cta): \"I tuoi jeans portano il nome di una città. Quale?\""}
      - {ruolo: domanda,  guida: "La domanda letta per intero con le opzioni A, B, C (frase un po' più lunga: dà tempo per pensare)."}
      - {ruolo: attesa,   guida: "\"Tre. Due. Uno.\" con ritmo: 1.0 (una parola al secondo) e scheda domanda + conto: 3 (numeri giganti, tic, anello): la suspense prima della risposta."}
      - {ruolo: risposta, guida: "\"È la B: Genova!\" + perché, in 1-2 frasi; meglio se c'è una trappola (l'opzione quasi giusta) da spiegare in un dettaglio."}
      - {ruolo: commenta, guida: "Reazione breve, senza chiedere nulla (la richiesta di commento è la CTA): \"Quanti l'avranno sbagliata?\""}
    cta: "Segui la pagina e metti like!"     # Antonio, 2026-11-22: CTA fissa in tutti i video
    cta_azione: segui_like
    hashtag: "#cintre #quizmoda #moda #stile #lo_sapevi"
    rese:
      3d:
        scene: []
        ricetta:
          - "(Solo con mascotte: true) Modella Cintre nello studio (studioFotografico o studio) che indica i cartelli A/B/C (card di oggetti.js)."
          - "Domanda sugli abbinamenti: la modella cambia outfit (indossa) per ogni opzione, una alla volta."
          - "Risposta: la modella con l'outfit giusto fa 'gioia', scintille (oggetti.scintille)."
          - "Ultimo atto = cartelloFinale."
      2d:
        scene: [cartoon2d, schede2d]
        ricetta:
          - "Scena predefinita cartoon2d (ritmo alto: opzioni a pillola che entrano una alla volta, conto alla rovescia 3-2-1, X rossa sulle sbagliate, GIUSTA! con esplosione); schede2d per una versione calma."
          - "Schede: gancio → domanda (opzioni) → domanda con conto: 3 (attesa) → risposta (giusta) → [dettaglio: la trappola o il perché] → [commenta: reazione]. Poi cta."
          - "Opzioni brevi (max 2-3 parole), sempre 3, tutte plausibili; una 'trappola' quasi giusta rende il commento irresistibile. La giusta non sempre la stessa lettera."
          - "La risposta arriva solo dopo il conto (3-5 s di suspense dalla fine della domanda): è ciò che tiene fino alla fine. Durata totale sotto i 30 s."
          - "Domanda e opzioni leggibili a schermo anche senza audio; niente testo sotto il 58% dell'altezza (lì vanno i sottotitoli)."

  curiosita:
    nome: Curiosità
    scopo: "\"Lo sapevi?\" di moda: fatti storici o pratici veri e sorprendenti, in serie numerata."
    durata: [20, 40]
    # STRUTTURA A DOMANDA APERTA (studio del 2026-11-21, @viewcci, skill regia-reel §12): la gente se ne va appena
    # ha la risposta, quindi la risposta arriva PER ULTIMA e dopo c'è solo la CTA breve. Vale anche per la serie
    # numerata ("N cose"): gancio → (fatto → dettaglio) × N, con il rehook prima dell'ultima e la più assurda in fondo.
    struttura:
      - {ruolo: gancio,    guida: "APRE la domanda: il fatto più forte e vero, con un numero o un contrasto, ≤ 12 parole (hook_e_cta). Non risponde: \"Per colorare di viola un bordo servivano 12.000 lumache.\""}
      - {ruolo: sviluppo,  guida: "ATTESA 1: rende la domanda più grande senza rispondere (posta in gioco, contesto): \"Per questo la porpora costava una fortuna.\""}
      - {ruolo: rehook,    guida: "RILANCIA a metà video (scheda rehook, obbligatoria: il build avvisa se manca): \"Così Nerone ebbe un'idea assurda.\""}
      - {ruolo: sviluppo,  guida: "ATTESA 2: la storia si complica, il perché manca ancora: \"La vietò, e mandò un uomo a venderla di nascosto.\""}
      - {ruolo: payoff,    guida: "RISPOSTA, per ultima e più forte (timbro, boom): \"Era una trappola: fece chiudere tutti i negozi.\" Dopo c'è solo la CTA, ≤ 7 parole."}
    cta: "Segui la pagina e metti like!"     # Antonio, 2026-11-22: CTA fissa in tutti i video
    cta_azione: segui_like
    hashtag: "#cintre #curiosità #moda #storiadellamoda #lo_sapevi #stile"
    rese:
      3d:
        scene: []
        ricetta:
          - "(Solo con mascotte: true) La modella Cintre fa da presentatrice nello studio: 'posa' sul gancio, 'gioia' sulle sorprese."
          - "Ogni fatto mostra il capo di cui si parla: vetrinaCapo (pedana girevole) o la modella che lo indossa (indossa)."
          - "Numero del fatto su card (oggetti.js) nella parte alta; ultimo atto = cartelloFinale."
      2d:
        scene: [cartoon2d, schede2d]
        ricetta:
          - "Scena predefinita cartoon2d (motion graphics a ritmo alto, vedi ritmo_alto; modella Cintre 2D solo con mascotte: true); schede2d per una versione calma."
          - "Schede: gancio → attesa → rehook → attesa → payoff (storia), oppure gancio → (fatto → dettaglio) × 3 con un rehook prima dell'ultimo fatto (serie). Poi cta (UNA richiesta: niente scheda commenta prima, sarebbe una seconda CTA)."
          - "Dentro ogni frase: un oggetto nuovo per ogni nome concreto detto dalla voce (scena2d → oggetti con dopo:), così il centro cambia ogni 0,5-1,5 s (regia-reel §13)."
          - "Nel dettaglio 'evidenzia' (o 'timbro') diventa il timbro che sbatte sullo schermo: una parola forte (TRINCEE, ATOMICA)."
          - "Ogni fatto ha un'icona del capo (taschino, tacco, tubino...) e il dettaglio un'icona della spiegazione (orologio, staffa, auto...)."
          - "Titoli delle schede brevi (max 5 parole): il testo completo lo danno voce e sottotitoli."
