<!doctype html>
<html><head><meta charset="utf-8"><title>oggetto</title>
<style>html,body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh}</style>
</head><body>
<script type="module">
import { start, textPlane, ease, viewSize } from './common.js';
// Oggetto 3D (nodo toroidale) metallico che ruota, con titolo opzionale in basso.
start({ testo: '', colore: '#0b0c10', accento: '#66fcf1', durata: '8' }, (THREE, p) => {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(p.colore);
  const camera = new THREE.PerspectiveCamera(45, 1080 / 1920, 0.1, 100);
  camera.position.set(0, 0, 12);
  const obj = new THREE.Mesh(new THREE.TorusKnotGeometry(2, 0.6, 220, 32),
    new THREE.MeshStandardMaterial({ color: p.accento, metalness: 0.6, roughness: 0.25 }));
  obj.position.y = 1.4;
  scene.add(obj);
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const l1 = new THREE.DirectionalLight(0xffffff, 2.2); l1.position.set(5, 6, 8); scene.add(l1);
  const l2 = new THREE.PointLight(p.accento, 60, 30); scene.add(l2);
  let text = null;
  if (p.testo) { text = textPlane(p.testo, viewSize(camera, 12).w * 0.88, { fontSize: 80 }); text.position.y = -viewSize(camera, 12).h * 0.27; scene.add(text); }
  return { scene, camera, update(t) {
    obj.rotation.set(t * 0.4, t * 0.7, 0);
    obj.scale.setScalar(0.5 + ease(t / 1.5) * 0.32);
    l2.position.set(Math.cos(t) * 6, Math.sin(t * 0.8) * 5, 4);
    if (text) text.material.opacity = ease((t - 0.8) / 1.0);
  } };
});
</script>
</body></html>
