<!doctype html>
<html><head><meta charset="utf-8"><title>cartoon2d</title>
<style>html,body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh}</style>
</head><body>
<script type="module">
// Resa 2D AD ALTO RITMO (curiosità, ma vale per ogni formato a schede): la modella Cintre disegnata in 2D presenta
// le schede; a ogni "battuta" (parametro battute, calcolato da auto_ig/audio.py e uguale per gli effetti sonori)
// cambia qualcosa: stacco con tendina, punch-in, posa, timbro, esplosione. Niente dissolvenza d'ingresso:
// il gancio è a schermo dal fotogramma 0.
// Quiz: un gancio con `opzioni` è già la schermata del quiz (domanda + A/B/C dal fotogramma 0).
// Foto vere (Wikimedia, PD/CC0): campo foto = file in <richiesta>/foto/, su gancio/domanda/fatto/dettaglio/foto.
// In cornice (parametro cornice o campo scheda: preset di foto2d.js) e VIVA: ondula, riflesso, glitch sulle battute.
// Quiz: domanda e risposta senza foto ereditano quella del gancio; foto_risposta la cambia sulla risposta.
// Parametri: schede (JSON, tipi in formati.yaml → schede_2d, + rehook), atti, fini, battute "t:tipo,...",
//            fine, colore, accento, outfit (nome di brand.js OUTFITS).
// Solo regia: personaggio ed effetti da preset/cartoon2d.js, icone e CTA da preset/grafica2d.js.
import { start } from './common.js';
import { tempiAtti } from '../preset/regia.js';
import { BORDEAUX, CIPRIA, SCURO, CREMA, gruccia } from '../preset/brand.js';
import * as G from '../preset/grafica2d.js';
import * as C from '../preset/cartoon2d.js';
import { caricaFoto, fotoViva, nomeCornice } from '../preset/foto2d.js';
import { timeline, mappa, contatore, radar, chat, lente, confronto } from '../preset/infografica2d.js';
import { scena2d } from '../preset/personaggi2d.js';
import { narratore, statoNarratore, caricaTraccia, posNarratore } from '../preset/narratore.js';

const ESEMPIO = [
  { tipo: 'gancio', titolo: '3 capi nati in guerra', evidenzia: 'guerra' },
  { tipo: 'fatto', numero: 1, titolo: 'Il trench', icona: 'trench' },
  { tipo: 'dettaglio', testo: 'Nato nelle trincee', evidenzia: 'trincee', icona: 'elmetto' },
  { tipo: 'rehook', titolo: "Aspetta l'ultimo…" },
  { tipo: 'fatto', numero: 2, titolo: 'Il bikini', icona: 'bikini' },
  { tipo: 'commenta', titolo: 'Quale ti ha sorpreso di più?', evidenzia: 'sorpreso' },
  { tipo: 'cta', titolo: 'Segui Cintre per altre curiosità di moda!', bottone: 'Segui @cintre_official' },
];
const ETICHETTA = { curiosita: 'Lo sapevi?', quiz: 'Quiz di moda', storia: 'Storia' };
const SCURO2 = '#4a0f24';
// Mescola due colori '#rrggbb' (k = quota di b): serve a derivare i fondi alternati dalla palette della richiesta.
const mescola = (a, b, k) => '#' + [1, 3, 5].map((j) => Math.round(parseInt(a.slice(j, j + 2), 16) * (1 - k) + parseInt(b.slice(j, j + 2), 16) * k)
  .toString(16).padStart(2, '0')).join('');

start({ schede: '', colore: BORDEAUX, accento: CIPRIA, formato: 'curiosita', durata: '20', outfit: '', mascotte: '0', cornice: '', narratore: '' }, (THREE, p, renderer) => {
  const S = p.schede ? JSON.parse(p.schede) : ESEMPIO;
  const FOTO = caricaFoto(S);
  const atti = tempiAtti(p, S.length);
  const voceInizi = String(p.atti || atti.inizi.join(',')).split(',').map(Number);
  const fini = p.fini ? String(p.fini).split(',').map(Number) : voceInizi.map((a, i) => (atti.inizi[i + 1] ?? atti.fine) - 0.4);
  const BT = (p.battute ? String(p.battute).split(',').map((x) => { const [t, k] = x.split(':'); return { t: +t, k }; })
    : atti.inizi.map((t, i) => ({ t, k: i ? 'stacco' : 'via' }))).sort((a, b) => a.t - b.t);
  // pop delle opzioni (auto_ig/audio.suoni): "t:n,..." → l'opzione n rimbalza quando si sente il suo pop
  const POP = String(p.pop || '').split(',').filter(Boolean).map((x) => { const [t, n] = x.split(':'); return { t: +t, n: +n }; });
  const popOpz = (t, n) => POP.reduce((e, q) => (q.n === n && t >= q.t ? Math.max(e, Math.exp(-(t - q.t) * 6)) : e), 0);
  const tela = G.tela2d(THREE, renderer), ctx = tela.ctx, acc = p.accento || CIPRIA;
  // Fondi: con la palette Cintre (bordeaux) restano quelli di sempre; con un altro colore si derivano da quello,
  // così una scheda su due non torna bordeaux in un video nero/oro o verde/oro.
  const proprio = /^#[0-9a-f]{6}$/i.test(p.colore || '') && p.colore.toLowerCase() !== BORDEAUX.toLowerCase();
  const ALT = proprio ? mescola(p.colore, acc, 0.1) : SCURO2, BUIO = proprio ? mescola(p.colore, '#000000', 0.45) : SCURO;
  const outfit = C.outfitDaNome(p.outfit);
  const MASCOTTE = p.mascotte === '1';          // modella Cintre 2D solo se Antonio la chiede
  // la gruccia narratrice (preset/narratore.js): labiale ed espressioni calcolati da auto_ig/labiale.py
  const NARRA = caricaTraccia(p.narratore), POSN = NARRA && posNarratore(NARRA);
  const iCta = S.findIndex((x) => x.tipo === 'cta'), inchino = iCta >= 0 ? (voceInizi[iCta] ?? null) : null;
  const etichetta = ETICHETTA[p.formato] || 'Cintre';
  const CORNICE = nomeCornice(p.cornice, p.formato === 'quiz' ? 'oro' : 'polaroid');
  const cornDi = (s) => nomeCornice(s.cornice, CORNICE);
  // energia della battuta forte (onda più ampia + glitch sulla foto); niente glitch sul fotogramma 0
  const colpo = (bt) => (bt.b === 0 ? 0 : ({ boom: 1, rivela: 1, stacco: 0.5, punch: 0.35 }[bt.k] ?? 0) * Math.exp(-bt.dt * 5));
  // la foto della scheda, viva: usata da quiz, curiosità e premio
  function foto(s, cx, cy, w, h, u, t, bt, opz = {}) {
    fotoViva(ctx, FOTO.mappa[s.foto], cx, cy, w, h, u, t, { cornice: cornDi(s), credito: s.credito || 'Foto: Wikimedia Commons', colpo: colpo(bt), ...opz });
  }
  const fatti = S.map((s, k) => (s.tipo === 'fatto' ? k : -1)).filter((k) => k >= 0);
  const iconeFatti = fatti.map((k) => S[k].icona || 'stella');

  // battuta corrente e quante battute ci sono state dall'inizio della frase i
  function battuta(t) {
    let b = 0; for (let k = 0; k < BT.length; k++) if (BT[k].t <= t + 1e-6) b = k;
    return { b, ...BT[b], dt: t - BT[b].t };
  }
  const nelFrase = (b, i) => BT.filter((x, k) => k <= b && x.t >= atti.inizi[i] - 1e-6).length - 1;   // 0 = stacco iniziale
  const parla = (t) => voceInizi.some((a, j) => t >= a && t <= fini[j]);
  const scoperte = (i) => fatti.filter((k) => k <= i).length;

  // zoom e fuoco per battuta (irregolari: niente metronomo)
  const LIV = [1.08, 1.0, 1.14, 1.04];
  const livello = (k, b) => ({ via: 1.0, boom: 1.0, stacco: 1.0, rivela: 1.1, tic: 1.0 + 0.03 * (b % 3) }[k] ?? LIV[b % 4]);

  // Pose ed espressioni per tipo: una per battuta dentro la frase (si cicla)
  const COPIONE = {
    gancio:    [['sorpresa', 'wow'], ['presenta', 'furba'], ['indica', 'felice']],
    fatto:     [['indica', 'felice'], ['presenta', 'neutra'], ['spalle', 'furba']],
    scena:     [['presenta', 'neutra'], ['indica', 'felice']],
    dettaglio: [['sorpresa', 'sorpresa'], ['gioia', 'wow'], ['spalle', 'furba']],
    rehook:    [['pensa', 'furba'], ['indica', 'furba']],
    commenta:  [['gioia', 'felice'], ['saluta', 'felice']],
  };

  // Disposizione: personaggio e adesivo si scambiano lato a ogni frase (cambio d'inquadratura)
  function lati(i) { return i % 2 ? { pc: 790, ic: 300 } : { pc: 290, ic: 770 }; }

  // Senza mascotte: l'oggetto è il protagonista. Adesivo grande al centro che "reagisce" a ogni battuta.
  function reazione(bt) {
    const e = Math.exp(-bt.dt * 7), k = { via: 0, boom: 1, rivela: 1, punch: 0.6, stacco: 0.4 }[bt.k] ?? 0.4;
    return { sc: 1 + 0.1 * k * e * Math.cos(bt.dt * 22), rot: 0.12 * k * e * Math.sin(bt.dt * 18) * (bt.b % 2 ? 1 : -1) };
  }
  function scenaSola(s, i, t, u, bt, nb) {
    const n = scoperte(i), r = reazione(bt);
    const grande = (nome, x, y, lato, uu, opz = {}) => {
      ctx.save(); ctx.translate(x, y); ctx.rotate(r.rot); ctx.scale(r.sc, r.sc); ctx.translate(-x, -y);
      C.adesivo(ctx, nome, x, y, lato, uu, { t, accento: acc, ...opz }); ctx.restore();
    };
    // GRAFICA VIVA (Antonio, 2026-11-19: "serve qualcosa di dinamico fin dall'inizio"): contatore, radar, scena con
    // personaggi. Come scheda a sé o dentro il gancio (`grafica:`), dove parte con `anticipo` (default 0.6 s) così
    // il fotogramma 0 è già a metà movimento.
    const viva = (x) => ['contatore', 'radar', 'scena2d', 'chat', 'lente', 'confronto'].includes(x.tipo);
    const g = s.tipo === 'gancio' && s.grafica ? s.grafica : (s.tipo === 'contatore' || s.tipo === 'radar' || s.tipo === 'scena2d' || s.tipo === 'chat' || s.tipo === 'lente' || s.tipo === 'confronto') ? s : null;
    if (g && viva(g)) {
      const ug = u + (s.tipo === 'gancio' ? (g.anticipo ?? (g.tipo === 'contatore' ? 0.25 : 0.6)) : 0);
      if (g.tipo === 'contatore') contatore(ctx, g, ug, t, { accento: acc });
      else if (g.tipo === 'radar') radar(ctx, g, ug, t, { accento: acc });
      else if (g.tipo === 'chat') chat(ctx, g, ug, t, { accento: acc });
      else if (g.tipo === 'lente') lente(ctx, g, ug, t, { accento: acc });
      else if (g.tipo === 'confronto') confronto(ctx, g, ug, t, { accento: acc });
      else scena2d(ctx, g, ug, t, { accento: acc });
      const gancio = s.tipo === 'gancio';
      C.scritta(ctx, s.titolo || '', 540, gancio ? 300 : 330, gancio ? 1 : u, { size: gancio ? 92 : 76, maxW: 940, evidenzia: s.evidenzia, accento: acc, passo: gancio ? 0 : 0.05 });
      if (s.timbro && (nb >= 1 || gancio)) C.timbro(ctx, String(s.timbro).toUpperCase(), 820, gancio ? 500 : 520, gancio ? u + 1 : bt.dt + (nb > 1 ? 1 : 0), { size: 64, fondo: '#ffd166', ruota: 0.1 });
    } else if (s.tipo === 'timeline') {               // infografica: la timeline cresce di una tappa a frase
      const prima = i > 0 && S[i - 1].tipo === 'timeline' && S[i - 1].titolo === s.titolo;
      C.scritta(ctx, s.titolo || '', 540, 330, prima ? 1 : u, { size: 76, maxW: 920, evidenzia: s.evidenzia, accento: acc, passo: prima ? 0 : 0.05 });
      timeline(ctx, s.tappe || [], s.attiva ?? 0, u, t, { accento: acc });
      if (s.timbro && nb >= 1) C.timbro(ctx, String(s.timbro).toUpperCase(), 820, 1120, bt.dt + (nb > 1 ? 1 : 0), { size: 64, fondo: '#ffd166', ruota: -0.08 });
    } else if (s.tipo === 'mappa') {                  // infografica: la mappa con il viaggio che si disegna mentre la voce parla
      const dur = (fini[i] ?? (u + 2)) - voceInizi[i];
      C.scritta(ctx, s.titolo || '', 540, 330, u, { size: 76, maxW: 920, evidenzia: s.evidenzia, accento: acc, passo: 0.05 });
      mappa(ctx, s.regione || 'usa', G.clamp((u - 0.3) / Math.max(0.8, dur - 0.6)), u, t, { accento: acc, mezzo: s.icona || 'auto' });
      if (s.timbro && nb >= 1) C.timbro(ctx, String(s.timbro).toUpperCase(), 820, 1120, bt.dt + (nb > 1 ? 1 : 0), { size: 64, fondo: '#ffd166', ruota: -0.08 });
    } else if (s.foto && ['gancio', 'fatto', 'scena', 'dettaglio'].includes(s.tipo)) {   // curiosità con la foto: poca scritta, foto grande
      if (s.tipo === 'fatto' || s.tipo === 'scena') C.contatore(ctx, n, fatti.length, 540, 268, u, { accento: acc });
      const tit = s.tipo === 'dettaglio' ? (s.testo || s.titolo || '') : (s.titolo || '');
      C.scritta(ctx, tit, 540, s.tipo === 'gancio' ? 300 : 380, u, { size: 80, maxW: 920, evidenzia: s.evidenzia, accento: acc, passo: i === 0 ? 0 : 0.05 });
      ctx.save(); ctx.translate(540, 780); ctx.rotate(r.rot * 0.5); ctx.translate(-540, -780);
      foto(s, 540, s.tipo === 'gancio' ? 740 : 790, 800, 540, u - (i === 0 ? 0 : 0.05), t, bt, { entrata: i !== 0, ruota: i % 2 ? 0.025 : -0.025 });
      ctx.restore();
      if (s.timbro && (nb >= 1 || i === 0)) C.timbro(ctx, String(s.timbro).toUpperCase(), 860, s.tipo === 'gancio' ? 450 : 520, i === 0 ? u + 1 : bt.dt + (nb > 1 ? 1 : 0), { size: 60, fondo: '#ffd166', ruota: 0.1 });
    } else if (s.tipo === 'gancio') {
      C.scritta(ctx, s.titolo || '', 540, 385, u, { size: 100, maxW: 860, evidenzia: s.evidenzia, accento: acc, passo: 0 });   // sotto l'intestazione anche col boom
      grande(s.icona || iconeFatti[0] || 'stella', 540, 745, 400, 1, { ruota: -0.05 });
      if (s.timbro) C.timbro(ctx, s.timbro.toUpperCase(), 770, 585, u - 0.25, { size: 58, fondo: '#ffd166', ruota: 0.12 });
      C.carteMistero(ctx, iconeFatti.length ? iconeFatti : ['stella', 'stella', 'stella'], 0, 540, 1020, 150, t, { accento: acc, attiva: nb >= 1 ? nb % 3 : -1 });
    } else if (s.tipo === 'fatto' || s.tipo === 'scena') {
      C.contatore(ctx, n, fatti.length, 540, 268, u, { accento: acc });
      C.scritta(ctx, s.titolo || '', 540, 395, u, { size: 104, maxW: 860, evidenzia: s.evidenzia, accento: acc });
      grande(s.icona, 540, 790, 500, u - 0.05, { ruota: i % 2 ? 0.05 : -0.05 });
      // timbro facoltativo sulla card (es. "Banned", "Sold out"): si stampa mezzo secondo dopo l'entrata
      if (s.timbro) C.timbro(ctx, String(s.timbro).toUpperCase(), 790, 1040, u - 0.5, { size: 72, fondo: '#ffd166', ruota: -0.1 });
    } else if (s.tipo === 'dettaglio') {
      const f = S[[...fatti].reverse().find((k) => k < i) ?? i] || {};
      C.scritta(ctx, s.testo || s.titolo || '', 540, 395, u, { size: 96, maxW: 860, evidenzia: s.evidenzia, accento: acc, passo: 0.07 });   // sotto l'intestazione anche su due righe
      if (f.icona) { C.adesivo(ctx, f.icona, 230, 600, 200, 1, { t, accento: acc, ruota: -0.12 }); G.freccia(ctx, 330, 630, 470, 700, { k: G.entra(u, 0.1, 0.3), colore: acc }); }
      grande(s.icona, 620, 800, 440, u - 0.05, { dall: 'pop', ruota: 0.05 });
      const parola = (s.timbro || s.evidenzia || '').toUpperCase();
      if (parola && nb >= 1) C.timbro(ctx, parola + '!', 600, 1070, bt.dt + (nb > 1 ? 1 : 0), { size: 76, fondo: '#ffd166', ruota: -0.08 });
    } else if (s.tipo === 'rehook') {
      const sx = Math.sin(t * 40) * 6 * Math.exp(-u * 2);
      ctx.save(); ctx.translate(sx, 0);
      C.scritta(ctx, s.titolo || 'Aspetta…', 540, 350, u, { size: 112, maxW: 820, evidenzia: s.evidenzia, accento: '#ffd166', pennarello: SCURO, passo: 0.08 });
      ctx.restore();
      ctx.save(); ctx.translate(540, 790); ctx.rotate(r.rot); ctx.scale(r.sc, r.sc); ctx.translate(-540, -790);
      C.carteMistero(ctx, [iconeFatti[n] || 'stella'], 0, 540, 790, 380, t, { accento: acc, attiva: 0 }); ctx.restore();
    } else if (s.tipo === 'foto') {
      scenaFoto(s, t, u, bt, nb, r);
    } else if (s.tipo === 'commenta') {
      C.fumetto(ctx, 90, 250, 900, 300, 540, 620);
      G.testo(ctx, s.titolo || '', 540, 400, { size: 72, peso: 900, colore: SCURO, evidenzia: s.evidenzia, accento: BORDEAUX, maxW: 800, parole: G.entra(u, 0.05, 0.5) });
      grande('commento', 540, 820, 380, u);
    } else {
      C.scritta(ctx, s.titolo || s.testo || '', 540, 360, u, { size: 96, maxW: 860, evidenzia: s.evidenzia, accento: acc });
      if (s.icona) grande(s.icona, 540, 780, 460, u);
    }
  }

  // FOTO: titolo in alto e la foto vera in una cornice polaroid (lento zoom); timbro facoltativo (es. l'anno)
  // la foto entra in bianco e nero e "si sviluppa" a colori; titolo corto sopra
  function scenaFoto(s, t, u, bt, nb, r = { sc: 1, rot: 0 }) {
    C.scritta(ctx, s.titolo || '', 540, 290, u, { size: 76, maxW: 920, evidenzia: s.evidenzia, accento: acc, passo: 0.05 });
    ctx.save(); ctx.translate(540, 760); ctx.rotate(r.rot * 0.5); ctx.scale(r.sc, r.sc); ctx.translate(-540, -760);
    foto(s, 540, 750, 860, 620, u - 0.05, t, bt, { ruota: -0.025, bn: 1 - G.clamp((u - 0.15) / 0.7) });
    ctx.restore();
    if (s.timbro && nb >= 1) C.timbro(ctx, String(s.timbro).toUpperCase(), 880, 420, bt.dt + (nb > 1 ? 1 : 0), { size: 64, fondo: '#ffd166', ruota: 0.1 });
  }

  // QUIZ: domanda in alto e 3 opzioni A/B/C a pillola. Le frasi "domanda" consecutive sono UNA card continua
  // (niente rientro); quella con `conto: N` è l'attesa: numero gigante N…1 che sbatte su ogni battuta "tic" e
  // anello che si svuota. "risposta": le sbagliate si barrano e sbiadiscono, la giusta (giusta: indice) si
  // illumina con la spunta e il timbro GIUSTA!; `testo` (facoltativo) è il perché, sotto.
  const QUIZ = ['domanda', 'risposta'];
  const eQuiz = (x) => !!x && (QUIZ.includes(x.tipo) || (x.tipo === 'gancio' && Array.isArray(x.opzioni) && x.opzioni.length > 0));
  const inizioQuiz = (i) => { let k = i; while (k > 0 && QUIZ.includes(S[k].tipo) && eQuiz(S[k - 1])) k--; return k; };
  // domanda e risposta senza foto ereditano quella della scheda prima del quiz (basta scriverla sul gancio)
  for (let k = 1; k < S.length; k++) {
    const a = S[k - 1], b = S[k];
    if (QUIZ.includes(b.tipo) && eQuiz(a) && !b.foto && a.foto) S[k] = { ...b, foto: a.foto, credito: b.credito || a.credito, cornice: b.cornice || a.cornice };
  }
  const OPZ_Y = (n, conFoto) => (conFoto ? 980 + n * 92 : 540 + n * 150);

  // QUIZ CON FOTO: domanda corta in alto, foto viva al centro (il 3-2-1 sopra la foto), opzioni compatte sotto.
  function quizFoto(s, i, t, u, bt, nb) {
    const i0 = inizioQuiz(i), uq = t - atti.inizi[i0], giusta = s.tipo === 'risposta' ? (s.giusta ?? 0) : -1;
    const subito = S[i0].tipo === 'gancio', kr = giusta >= 0 ? G.easeOut(u / 0.35) : 0;
    C.scritta(ctx, s.titolo || '', 540, 290, uq, { size: 66, maxW: 960, evidenzia: s.evidenzia, accento: acc, passo: i === i0 && !subito ? 0.05 : 0 });
    const cambia = giusta >= 0 && s.foto_risposta;
    foto(cambia ? { ...s, foto: s.foto_risposta } : s, 540, 640, 740, 420, cambia ? u : uq, t, bt, { entrata: cambia || !subito, ruota: -0.02 });
    const conto = s.conto ? +s.conto : 0, attesa = conto > 0;
    const urgenza = attesa ? G.clamp(u / Math.max(0.5, (fini[i] ?? t) - atti.inizi[i])) : 0;
    (s.opzioni || []).forEach((o, n) => {
      const y = OPZ_Y(n, true), ke = giusta >= 0 || i > i0 || subito ? 1 : G.entra(uq, 0.55 + n * 0.3, 0.3), ok = n === giusta;
      if (ke <= 0) return;
      const vib = attesa ? Math.sin(t * 38 + n * 2) * (2 + 5 * urgenza) : 0;
      const bump = (!attesa && giusta < 0 && bt.k === 'punch' && nb % 3 === n ? 0.06 * Math.exp(-bt.dt * 6) : 0)
        + (giusta < 0 ? 0.12 * popOpz(t, n) : 0);
      const cade = giusta >= 0 && !ok ? kr : 0;
      ctx.save(); ctx.translate(540 + vib + Math.sin(u * 30) * 10 * cade * Math.exp(-u * 4), y + cade * 8);
      const sc = G.pop(ke) * (1 + bump + (ok ? 0.07 * kr : 0)); ctx.scale(sc, sc); ctx.rotate(cade * (n % 2 ? 0.03 : -0.03));
      ctx.globalAlpha *= 1 - 0.6 * cade;
      ctx.shadowColor = 'rgba(20,4,10,0.45)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
      ctx.fillStyle = ok && kr > 0.4 ? '#ffd166' : CREMA; G.rr(ctx, -400, -42, 800, 84, 42); ctx.fill(); ctx.shadowColor = 'transparent';
      ctx.lineWidth = 5; ctx.strokeStyle = SCURO; ctx.stroke();
      G.pillola(ctx, 'ABC'[n], -350, 0, { size: 40, fondo: ok && kr > 0.4 ? BORDEAUX : acc, colore: ok && kr > 0.4 ? '#ffd166' : BORDEAUX, w: 68, h: 68 });
      ctx.font = G.FONT(50, 900); ctx.fillStyle = SCURO; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillText(o, -296, 3);
      if (ok && kr > 0.4) { ctx.fillStyle = '#2e9e5b'; ctx.font = G.FONT(68, 900); ctx.textAlign = 'center'; ctx.fillText('✓', 345, 5); }
      if (cade > 0) {
        const k2 = G.clamp(cade * 1.4); ctx.globalAlpha = 1; ctx.strokeStyle = '#e8435a'; ctx.lineWidth = 12; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-372, 0); ctx.lineTo(-372 + 744 * k2, 0); ctx.stroke();
      }
      ctx.restore();
    });
    if (attesa) {                                         // 3-2-1 gigante sopra la foto
      const num = Math.max(1, conto - Math.max(0, nb)), r = 104, cx = 540, cy = 620;
      ctx.save(); ctx.fillStyle = 'rgba(20,4,10,0.55)'; ctx.beginPath(); ctx.arc(cx, cy, r + 26, 0, 7); ctx.fill();
      ctx.lineWidth = 16; ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
      ctx.strokeStyle = urgenza > 0.66 ? '#e8435a' : '#ffd166'; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - urgenza)); ctx.stroke(); ctx.restore();
      const sb = 1 + 0.5 * Math.exp(-bt.dt * 9);
      ctx.save(); ctx.translate(cx, cy); ctx.scale(sb, sb); ctx.rotate(0.12 * Math.exp(-bt.dt * 9) * (nb % 2 ? 1 : -1));
      ctx.font = G.FONT(170, 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.lineWidth = 20; ctx.strokeStyle = SCURO; ctx.strokeText(String(num), 0, 8); ctx.fillStyle = '#fff'; ctx.fillText(String(num), 0, 8); ctx.restore();
    }
    if (giusta >= 0) {
      C.timbro(ctx, s.timbro || 'GIUSTA!', 800, OPZ_Y(giusta, true) - 58, u - 0.15, { size: 50, fondo: '#2e9e5b', colore: '#fff', ruota: 0.12 });
      // il perché: solo se corto (≤ 5 parole), come adesivo sul fondo della foto; sennò lo dice la voce
      if (s.testo && String(s.testo).trim().split(/\s+/).length <= 5)
        C.scritta(ctx, s.testo, 540, 770, u - 0.5, { size: 58, maxW: 900, evidenzia: s.evidenzia, accento: acc, passo: 0.05 });
    }
  }

  function quizScena(s, i, t, u, bt, nb) {
    if (s.foto) return quizFoto(s, i, t, u, bt, nb);
    const i0 = inizioQuiz(i), uq = t - atti.inizi[i0], giusta = s.tipo === 'risposta' ? (s.giusta ?? 0) : -1;
    const subito = S[i0].tipo === 'gancio';               // gancio-quiz: domanda e opzioni già a schermo al fotogramma 0
    const kr = giusta >= 0 ? G.easeOut(u / 0.35) : 0;
    C.scritta(ctx, s.titolo || '', 540, 330, uq, { size: 80, maxW: 900, evidenzia: s.evidenzia, accento: acc, passo: i === i0 && !subito ? 0.05 : 0 });
    const conto = s.conto ? +s.conto : 0, attesa = conto > 0;
    const urgenza = attesa ? G.clamp(u / Math.max(0.5, (fini[i] ?? t) - atti.inizi[i])) : 0;
    (s.opzioni || []).forEach((o, n) => {
      const y = 540 + n * 150, ke = giusta >= 0 || i > i0 || subito ? 1 : G.entra(uq, 0.55 + n * 0.3, 0.3), ok = n === giusta;
      if (ke <= 0) return;
      const vib = attesa ? Math.sin(t * 38 + n * 2) * (3 + 7 * urgenza) : 0;
      const bump = (!attesa && giusta < 0 && bt.k === 'punch' && nb % 3 === n ? 0.06 * Math.exp(-bt.dt * 6) : 0)
        + (giusta < 0 ? 0.12 * popOpz(t, n) : 0);
      const cade = giusta >= 0 && !ok ? kr : 0;
      ctx.save(); ctx.translate(540 + vib + Math.sin(u * 30) * 10 * cade * Math.exp(-u * 4), y + cade * 10);
      const sc = G.pop(ke) * (1 + bump + (ok ? 0.08 * kr : 0)); ctx.scale(sc, sc); ctx.rotate(cade * (n % 2 ? 0.04 : -0.04));
      ctx.globalAlpha *= 1 - 0.6 * cade;
      ctx.shadowColor = 'rgba(20,4,10,0.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
      ctx.fillStyle = ok && kr > 0.4 ? '#ffd166' : CREMA; G.rr(ctx, -410, -58, 820, 116, 58); ctx.fill(); ctx.shadowColor = 'transparent';
      ctx.lineWidth = 6; ctx.strokeStyle = SCURO; ctx.stroke();
      G.pillola(ctx, 'ABC'[n], -335, 0, { size: 52, fondo: ok && kr > 0.4 ? BORDEAUX : acc, colore: ok && kr > 0.4 ? '#ffd166' : BORDEAUX, w: 92, h: 92 });
      ctx.font = G.FONT(62, 900); ctx.fillStyle = SCURO; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillText(o, -260, 4);
      if (ok && kr > 0.4) { ctx.fillStyle = '#2e9e5b'; ctx.font = G.FONT(84, 900); ctx.textAlign = 'center'; ctx.fillText('✓', 340, 6); }
      if (cade > 0) {                                     // X rossa che si disegna sopra la sbagliata
        const k2 = G.clamp(cade * 1.4); ctx.globalAlpha = 1; ctx.strokeStyle = '#e8435a'; ctx.lineWidth = 14; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-380, 0); ctx.lineTo(-380 + 760 * k2, 0); ctx.stroke();
      }
      ctx.restore();
    });
    if (attesa) {                                         // conto alla rovescia: N … 1, uno per battuta "tic"
      const num = Math.max(1, conto - Math.max(0, nb)), r = 92, cx = 540, cy = 1010;
      ctx.save(); ctx.lineWidth = 16; ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
      ctx.strokeStyle = urgenza > 0.66 ? '#e8435a' : '#ffd166'; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - urgenza)); ctx.stroke(); ctx.restore();
      const sb = 1 + 0.5 * Math.exp(-bt.dt * 9);
      ctx.save(); ctx.translate(cx, cy); ctx.scale(sb, sb); ctx.rotate(0.12 * Math.exp(-bt.dt * 9) * (nb % 2 ? 1 : -1));
      ctx.font = G.FONT(150, 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.lineWidth = 20; ctx.strokeStyle = SCURO; ctx.strokeText(String(num), 0, 8); ctx.fillStyle = '#fff'; ctx.fillText(String(num), 0, 8); ctx.restore();
    }
    if (giusta >= 0) {
      C.timbro(ctx, s.timbro || 'GIUSTA!', 790, 540 + giusta * 150 - 78, u - 0.15, { size: 60, fondo: '#2e9e5b', colore: '#fff', ruota: 0.12 });
      if (s.testo) C.scritta(ctx, s.testo, 540, 1010, u - 0.5, { size: 60, maxW: 900, evidenzia: s.evidenzia, accento: acc, passo: 0.05 });
    }
  }

  function scena(s, i, t, u, bt, nb) {
    if (eQuiz(s)) return quizScena(s, i, t, u, bt, nb);
    if (s.tipo === 'foto' && MASCOTTE) return scenaFoto(s, t, u, bt, nb);
    if (!MASCOTTE) return scenaSola(s, i, t, u, bt, nb);
    const L = lati(i), cop = COPIONE[s.tipo] || COPIONE.scena, [posa, espr] = cop[Math.max(0, nb) % cop.length];
    const [posaPrima] = nb > 0 ? cop[(nb - 1) % cop.length] : ['neutro'];
    const kPosa = G.clamp(bt.dt / 0.28);
    const salto = (bt.k === 'boom' || bt.k === 'rivela') ? 34 * Math.sin(Math.PI * G.clamp(bt.dt / 0.32)) : 0;
    const specchia = (q) => (L.pc > 540 ? ({ indica: 'indicaSx', presenta: 'presenta' }[q] || q) : q);
    const lei = (x, y, sc, extra = {}) => C.cintre(ctx, x, y, sc, { posa: specchia(posa), da: specchia(posaPrima), k: kPosa, espr, parla: parla(t), t, outfit, salto, ...extra });
    const n = scoperte(i);

    if (s.tipo === 'gancio') {
      C.scritta(ctx, s.titolo || '', 540, 345, u, { size: 96, maxW: 820, evidenzia: s.evidenzia, accento: acc, passo: 0 });
      lei(540, 690, 1.0);
      C.carteMistero(ctx, iconeFatti.length ? iconeFatti : ['stella', 'stella', 'stella'], 0, 540, 1000, 175, t, { accento: acc, attiva: nb >= 1 ? nb % 3 : -1 });
    } else if (s.tipo === 'fatto' || s.tipo === 'scena') {
      C.contatore(ctx, n, fatti.length, 540, 268, u, { accento: acc });
      C.scritta(ctx, s.titolo || '', 540, 395, u, { size: 100, evidenzia: s.evidenzia, accento: acc });
      lei(L.pc, 690, 1.0);
      C.adesivo(ctx, s.icona, L.ic, 790, 400 * (nb >= 1 ? 1.06 : 1), u - 0.1, { t, accento: acc, ruota: L.ic > 540 ? 0.06 : -0.06 });
    } else if (s.tipo === 'dettaglio') {
      const f = S[[...fatti].reverse().find((k) => k < i) ?? i] || {};
      C.scritta(ctx, s.testo || s.titolo || '', 540, 335, u, { size: 92, evidenzia: s.evidenzia, accento: acc, passo: 0.07 });
      lei(L.pc, 690, 1.0);
      if (f.icona) C.adesivo(ctx, f.icona, L.ic + (L.ic > 540 ? 120 : -120), 590, 180, 1, { t, accento: acc, ruota: -0.12 });
      C.adesivo(ctx, s.icona, L.ic, 830, 380, u - 0.05, { t, accento: acc, dall: 'pop', ruota: L.ic > 540 ? -0.05 : 0.05 });
      const parola = (s.timbro || s.evidenzia || '').toUpperCase();
      if (parola && nb >= 1) C.timbro(ctx, parola + '!', L.ic, 1075, bt.dt + (nb > 1 ? 1 : 0), { size: 62, fondo: '#ffd166', ruota: L.ic > 540 ? 0.1 : -0.1 });
    } else if (s.tipo === 'rehook') {
      const sx = Math.sin(t * 40) * 6 * Math.exp(-u * 2);
      ctx.save(); ctx.translate(sx, 0);
      C.scritta(ctx, s.titolo || 'Aspetta…', 540, 350, u, { size: 104, maxW: 820, evidenzia: s.evidenzia, accento: '#ffd166', pennarello: SCURO, passo: 0.08 });
      ctx.restore();
      lei(290, 690, 1.0);
      C.carteMistero(ctx, [iconeFatti[n] || 'stella'], 0, 780, 810, 300, t, { accento: acc, attiva: 0 });
    } else if (s.tipo === 'commenta') {
      C.fumetto(ctx, 90, 250, 900, 300, 540, 600);
      G.testo(ctx, s.titolo || '', 540, 400, { size: 72, peso: 900, colore: SCURO, evidenzia: s.evidenzia, accento: BORDEAUX, maxW: 800, parole: G.entra(u, 0.05, 0.5) });
      for (let k = 0; k < 9; k++) {                        // cuori che salgono
        const v = ((u * 0.45 + k / 9) % 1), x = 120 + ((k * 0.618) % 1) * 840 + Math.sin(k * 2.3 + u * 3) * 40;
        ctx.save(); ctx.globalAlpha = Math.sin(Math.PI * v); G.icona(ctx, 'cuore', x, 1150 - v * 560, 60 + (k % 3) * 24, { accento: k % 2 ? '#e8435a' : acc }); ctx.restore();
      }
      lei(540, 760, 1.0);
    } else {                                               // domanda/risposta e altri: titolo + personaggio
      C.scritta(ctx, s.titolo || s.testo || '', 540, 360, u, { size: 84, evidenzia: s.evidenzia, accento: acc });
      lei(540, 690, 1.0);
    }
  }

  function hud(t, i, s) {
    C.barra(ctx, t / atti.fine, { colore: acc });
    gruccia(ctx, 104, 170, 56, acc, 5);
    ctx.save(); ctx.fillStyle = '#fff'; ctx.font = '700 44px "DejaVu Serif", serif'; ctx.textBaseline = 'middle'; ctx.fillText('Cintre', 148, 170);
    G.pillola(ctx, etichetta.toUpperCase(), 445, 172, { size: 28, fondo: acc, colore: BORDEAUX, h: 52 }); ctx.restore();
    if (fatti.length && s.tipo !== 'gancio') C.carteMistero(ctx, iconeFatti, scoperte(i), 870, 172, 62, t, { accento: acc, gap: 1.2 });
  }

  return { scene: tela.scene, camera: tela.camera, pronto: FOTO.pronto, update(t) {
    const { i, u } = atti.a(t), s = S[i] || {};
    const bt = battuta(t), nb = nelFrase(bt.b, i);
    const prima = BT[bt.b - 1];
    const z0 = prima ? livello(prima.k, bt.b - 1) : 1, z1 = livello(bt.k, bt.b);
    let zoom = G.clamp(bt.dt / 0.2) < 1 ? z0 + (z1 - z0) * C.backOut(bt.dt / 0.2) : z1;
    if (bt.k === 'boom') zoom += 0.12 * Math.exp(-bt.dt * 7);
    if (eQuiz(s) && s.foto) zoom = 1 + (zoom - 1) * 0.35;   // quiz con foto: pieno fino ai sottotitoli, zoom leggero
    const L = MASCOTTE ? lati(i) : { pc: 540, ic: s.tipo === 'dettaglio' ? 620 : 540 };
    let iq = i; while (s.tipo === 'timeline' && iq > 0 && S[iq - 1].tipo === 'timeline') iq--;   // timeline consecutive = una sola grafica
    const inQuiz = eQuiz(s); if (inQuiz) iq = inizioQuiz(i);
    const fuoco = inQuiz ? [540, s.foto ? 660 : 700] : !MASCOTTE ? [L.ic + (nb % 2 ? -50 : 50), 780]
      : nb % 2 ? [L.pc, 520] : [s.tipo === 'fatto' || s.tipo === 'dettaglio' ? L.ic : 540, 760];
    const forte = bt.k === 'boom' || bt.k === 'rivela';
    const amp = (forte ? 18 : 0) * Math.exp(-bt.dt * 9);
    const fondo = s.tipo === 'rehook' ? BUIO : s.tipo === 'cta' ? (p.colore || BORDEAUX) : (iq % 2 ? ALT : (p.colore || BORDEAUX));

    tela.inizia();
    C.camera(ctx, { zoom, fx: fuoco[0], fy: fuoco[1], sx: Math.sin(bt.dt * 55) * amp, sy: Math.cos(bt.dt * 47) * amp * 0.6 });
    C.sfondoPop(ctx, t, { colore: fondo, raggi: s.tipo === 'rehook' ? '#ffd166' : acc, alfa: s.tipo === 'rehook' ? 0.14 : 0.09,
      vel: s.tipo === 'rehook' ? 0.6 : 0.15, cx: fuoco[0], cy: fuoco[1] });
    C.lineeVelocita(ctx, fuoco[0], fuoco[1], forte ? Math.exp(-bt.dt * 3) : (bt.k === 'stacco' ? Math.exp(-bt.dt * 6) * 0.6 : 0));
    if (s.tipo === 'cta') {
      G.finale(ctx, u, { testo: s.titolo || '', bottone: s.bottone, azione: s.azione, accento: acc, t });
    } else scena(s, i, t, u, bt, nb);
    ctx.restore();

    // gancio con grafica viva: niente intestazione "Cintre · LO SAPEVI?" (sembra un template), solo la barra
    if (s.tipo === 'gancio' && s.grafica) C.barra(ctx, t / atti.fine, { colore: acc });
    else if (s.tipo !== 'cta') hud(t, i, s);
    // esplosioni sulle rivelazioni e sul gancio, tendina sugli stacchi, flash
    if (bt.k === 'rivela') C.esplosione(ctx, s.tipo === 'risposta' ? 540 : L.ic, s.tipo === 'risposta' ? OPZ_Y(s.giusta ?? 0, !!s.foto) : 800, bt.dt, { seme: bt.b, ...(s.tipo === 'risposta' ? { n: 34, forza: 1300 } : {}) });
    if (bt.k === 'boom') C.esplosione(ctx, 540, 360, bt.dt, { seme: bt.b + 5, n: 30, forza: 1300 });
    if (s.tipo === 'cta') C.esplosione(ctx, 540, 450, u - 0.1, { seme: 99, n: 34, forza: 1200 });
    if (bt.k !== 'punch' && bt.k !== 'tic' && !(i > iq) && bt.b > 0) C.tendina(ctx, bt.dt, { colore: acc, colore2: SCURO, dir: bt.b % 2 ? 1 : -1 });
    C.flash(ctx, ({ boom: 0.55, rivela: 0.3, punch: 0.12, stacco: 0, tic: 0.08 }[bt.k] ?? 0) * Math.exp(-bt.dt * 12) * (bt.b === 0 ? 0 : 1));
    // scatto fotografico (audio.suoni): flash bianco quando entra una foto nuova, non al fotogramma 0
    if (i > 0 && (s.tipo === 'foto' || (s.tipo === 'risposta' && s.foto_risposta))) {
      const d = t - voceInizi[i] - 0.05;
      if (d >= 0) C.flash(ctx, 0.45 * Math.exp(-d * 14));
    }
    // il narratore sta sopra tutto (anche tendine e flash): è il punto fermo del video
    if (NARRA) narratore(ctx, ...POSN, statoNarratore(NARRA, t, { inchino }));
    // ultimi 0,3 s: torna al colore d'apertura (il loop riparte pulito)
    const v = (t - (atti.fine - 0.3)) / 0.3;
    if (v > 0) { ctx.fillStyle = `rgba(26,7,16,${Math.min(1, v)})`; ctx.fillRect(0, 0, G.W, G.H); }
    tela.fine();
  } };
});
</script>
