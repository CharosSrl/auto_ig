<!doctype html>
<html><head><meta charset="utf-8"><title>cintre_storia</title>
<style>html,body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh}</style>
</head><body>
<script type="module">
// "Non so cosa mettermi → Cintre": 8 atti, uno per frase del copione (parametro atti).
// Solo regia: modella, ambienti, oggetti e qualità arrivano dai preset.
import { start } from './common.js';
import { creaModella } from '../preset/modella.js';
import { applicaQualita } from '../preset/qualita.js';
import { OUTFITS, OUTFIT_SERATA, OUTFIT_GRIGIO, SCURO } from '../preset/brand.js';
import { telefonoCintre, monitorRicerca, contatore } from '../preset/oggetti.js';
import { cameraDaLetto, scrivania, studio, pareteOutfit, passerella, cartelloFinale } from '../preset/ambienti.js';
import { tempiAtti, dissolvenza, inquadra, ease, mix } from '../preset/regia.js';

start({ atti: '0.6,3.1,5.6,8.0,10.1,12.7,15.0,17.6', fine: '21' }, (THREE, p, renderer) => {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1080 / 1920, 0.1, 200); scene.add(camera);
  const luci = applicaQualita(THREE, renderer, scene, p.qualita || 'alta');
  const atti = tempiAtti(p, 8, '0.6,3.1,5.6,8.0,10.1,12.7,15.0,17.6');
  const velo = dissolvenza(THREE, camera, SCURO);

  // set (uno ogni 30 unità sull'asse x)
  const letto = cameraDaLetto(THREE, 0);
  const pc = scrivania(THREE, 30);
  const app = studio(THREE, 60);
  const parete = pareteOutfit(THREE, 60);
  const sfilata = passerella(THREE, 90);
  const fine = cartelloFinale(THREE, 120);
  [letto, pc, app, parete, sfilata, fine].forEach((s) => scene.add(s.gruppo));
  luci.ombre(letto.gruppo, pc.gruppo, app.gruppo, sfilata.gruppo);

  const monitor = monitorRicerca(THREE);
  monitor.g.position.set(pc.monitor.x, pc.monitor.y, pc.monitor.z); monitor.g.rotation.y = pc.monitor.ry; scene.add(monitor.g);
  const telPiccolo = telefonoCintre(THREE, 0.34, 0.7); scene.add(telPiccolo.g);
  const telGrande = telefonoCintre(THREE, 1.55, 3.1); telGrande.g.position.set(60, 3.5, 0); scene.add(telGrande.g);
  const conta = contatore(THREE); scene.add(conta.mesh);

  const lei = creaModella(THREE, { outfit: OUTFIT_GRIGIO });
  scene.add(lei.root);
  const SET = ['letto', 'letto', 'pc', 'pc', 'app', 'outfit', 'passerella', 'fine'];

  return { scene, camera, update(t) {
    const { i, u, len } = atti.a(t);
    const set = SET[i];
    velo(i === 0 ? 1 - ease(t / 0.4) : (SET[i - 1] !== set ? 1 - ease(u / 0.35) : 0));
    lei.root.visible = ['letto', 'pc', 'outfit', 'passerella'].includes(set);
    telPiccolo.g.visible = i === 3;
    telGrande.g.visible = set === 'app';
    conta.mesh.visible = set === 'outfit';
    if (set !== 'outfit') parete.nascondi();
    sfilata.spegni();
    letto.rabbia(t, 0, null);
    scene.background = new THREE.Color(set === 'passerella' ? '#0d0306' : '#f3e6e0');

    if (set === 'letto') {             // 0: pesta i piedi · 1: i vestiti volano, mani nei capelli
      lei.setOutfit(OUTFIT_GRIGIO); lei.setMood('arrabbiata');
      lei.root.position.set(0.5, 0, 0.5); lei.root.rotation.y = -0.3;
      if (i === 0) lei.pose.pestaPiedi(t); else lei.pose.maniNeiCapelli(t);
      letto.volo(i === 1 ? u : -1);
      letto.rabbia(t, i === 0 ? 0.35 : 0.6, { x: 0.5, y: 3.5, z: 0.5 });
      const scossa = i === 1 ? Math.sin(t * 47) * 0.03 : 0;
      const z = mix(6.6, 5.9, ease(u / 2.5));              // dalle ginocchia in su: il viso si legge
      inquadra(camera, [0.0 + scossa, 3.0, z], [0.15, 2.45, -0.3]);
    }

    if (set === 'pc') {                // 2: cerca al computer · 3: trova Cintre, si gira sorridente col telefono
      lei.setOutfit(OUTFIT_GRIGIO);
      lei.root.position.set(29.6, 0, 0.6);
      if (i === 2) {
        lei.setMood('neutra'); lei.pose.digita(t); lei.root.rotation.y = 2.35;
        monitor.disegna(u);
        inquadra(camera, [29.95, 2.85, mix(7.4, 6.2, ease(u / len))], [30.45, 2.45, -0.5]);
      } else {
        const giro = ease(u / 0.6);
        lei.setMood(giro < 0.5 ? 'sorpresa' : 'felice'); lei.pose.telefono(t);
        lei.root.rotation.y = 2.35 * (1 - giro);
        monitor.disegna(9);
        const k = ease((u - 0.3) / 0.6);
        telPiccolo.g.position.set(29.6, 2.62, 0.6 + 0.62); telPiccolo.g.rotation.set(-0.2, 0, 0);   // sopra i sottotitoli
        telPiccolo.g.scale.setScalar(0.3 + 0.7 * k);
        telPiccolo.splash(k);
        inquadra(camera, [29.6, 2.75, mix(6.8, 4.9, ease(u / len))], [29.6, 2.3, 0.6]);
      }
    }

    if (set === 'app') {               // 4: primo piano sull'app: tocca "Elegante", scorrono gli outfit
      telGrande.app(u, len);
      telGrande.g.rotation.set(0.04, Math.sin(u * 1.4) * 0.07, Math.sin(u * 0.9) * 0.015);
      inquadra(camera, [60, 3.25, mix(7.2, 6.7, ease(u / len))], [60, 3.05, 0]);
    }

    if (set === 'outfit') {            // 5: mille outfit: parete di card, lei cambia vestito di continuo
      lei.setMood('felice'); lei.pose.gioia(t);
      lei.root.position.set(60, 0, -1.4); lei.root.rotation.y = Math.sin(u * 2) * 0.25;
      lei.setOutfit(OUTFITS[Math.floor(u / 0.3) % OUTFITS.length]);
      parete.aggiorna(u);
      conta.mesh.position.set(60, 4.75, -0.2);
      conta.disegna(Math.round(Math.min(1, ease(u / 1.2)) * 1000));
      inquadra(camera, [60, 3.0, 7.6], [60, 2.85, -1.5]);
    }

    if (set === 'passerella') {        // 6: sfila verso di noi tra i flash
      lei.setOutfit(OUTFIT_SERATA); lei.setMood('felice'); lei.pose.cammina(t, 6.5);
      const z = Math.min(0.4, -8.5 + u * 3.4);
      lei.root.position.set(90, 0.16, z); lei.root.rotation.y = 0;
      sfilata.flash(u, z);
      luci.segui(lei.root.position);
      inquadra(camera, [90, 2.9, 5.6], [90, 2.4, -5]);
    } else luci.segui(lei.root.position);

    if (set === 'fine') {              // 7: logo Cintre + slogan
      fine.aggiorna(u);
      inquadra(camera, [120, 2.6, 7.4], [120, 2.6, 0]);
    }

    lei.tick(t);
  } };
});
</script>
</body></html>
