<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>auto_ig — {% block titolo %}{% endblock %}</title>
<style>
  :root { --bordo:#ccc; --ok:#e6f4ea; --err:#fdecea; --mut:#666; }
  body { font: 15px/1.4 system-ui, sans-serif; margin: 0 auto; max-width: 1100px; padding: 0 16px 40px; background:#fafafa; color:#222; }
  nav { display:flex; gap:16px; align-items:center; padding:12px 0; border-bottom:1px solid var(--bordo); margin-bottom:16px; }
  nav a { text-decoration:none; color:#222; padding:4px 8px; border-radius:4px; }
  nav a.attivo { background:#222; color:#fff; }
  nav .acc { margin-left:auto; color:var(--mut); }
  .msg { padding:8px 12px; border-radius:4px; margin:6px 0; }
  .msg.ok { background:var(--ok); } .msg.errore { background:var(--err); }
  .griglia { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; }
  .card { background:#fff; border:1px solid var(--bordo); border-radius:6px; padding:8px; }
  .card img { width:100%; height:200px; object-fit:cover; border-radius:4px; background:#eee; }
  .piccolo { font-size:12px; color:var(--mut); word-break:break-word; }
  input, select, textarea, button { font:inherit; }
  textarea { width:100%; box-sizing:border-box; }
  table { width:100%; border-collapse:collapse; background:#fff; }
  td, th { border:1px solid var(--bordo); padding:6px; vertical-align:top; text-align:left; }
  td img { width:90px; height:112px; object-fit:cover; }
  .stato-pending { color:#a60; } .stato-published { color:#080; } .stato-error { color:#c00; }
  .azioni form { display:inline-block; margin:2px 0; }
  .avviso { background:#fff8e1; border:1px solid #f0d58c; padding:8px 12px; border-radius:4px; margin-bottom:12px; }
</style>
</head>
<body>
<nav>
  <strong>auto_ig</strong>
  {% set p = request.path %}
  <a href="{{ url_for('cerca') }}" class="{{ 'attivo' if p.startswith('/cerca') }}">Cerca immagini</a>
  <a href="{{ url_for('coda') }}" class="{{ 'attivo' if p.startswith('/coda') }}">Coda</a>
  <a href="{{ url_for('video') }}" class="{{ 'attivo' if p.startswith('/video') }}">Video</a>
  <span class="acc">@cintre_official</span>
</nav>
{% for cat, m in get_flashed_messages(with_categories=true) %}<div class="msg {{ cat }}">{{ m }}</div>{% endfor %}
{% block corpo %}{% endblock %}
</body>
</html>
